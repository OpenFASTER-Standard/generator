[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openfaster-generator"
version = "0.1.0"
description = "Source reference model and staleness-sweep tooling for OpenFASTER's MiKaDiv-FM regulatory schema"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "shapely>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "rdflib>=7.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0", "httpx>=0.24", "pyshacl>=0.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*", "webapp.frontend*"]
