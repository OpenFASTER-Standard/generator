[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openfaster-generator"
version = "0.1.0"
description = "OpenFASTER's generation/extraction/equivalence-checking/ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "lxml>=5.0",
    "xmlschema>=3.0",
    "openpyxl>=3.1",
    "exrex>=0.11",
    "allpairspy>=2.5",
    "pdfplumber>=0.11",
    "pyoxigraph>=0.5",
    "oxrdflib>=0.5",
    "pyshacl>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["extraction*", "generation*", "equivalence*", "ingestion*", "reporting*", "store*", "provenance*", "review*", "citations*", "webapp*"]
