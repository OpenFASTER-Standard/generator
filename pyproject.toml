[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openfaster-generator"
version = "0.1.0"
description = "RDF+SHACL semantic annotation model for OpenFASTER's MiKaDiv-FM regulatory schema"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "shapely>=2.0",
    "rdflib>=7.6",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pyrage>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyshacl>=0.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]
