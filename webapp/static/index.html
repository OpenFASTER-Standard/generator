<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MiKaDiv-FM References Catalog</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    th { background: #f0f0f0; }
    #empty { color: #666; font-style: italic; }
  </style>
</head>
<body>
  <h1>MiKaDiv-FM References Catalog</h1>
  <div id="content">Loading...</div>
  <script>
    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text;
      return td;
    }

    function renderError(message) {
      const content = document.getElementById("content");
      content.innerHTML = "";
      const p = document.createElement("p");
      p.id = "error";
      p.textContent = message;
      content.appendChild(p);
    }

    function renderCatalog(catalog) {
      const content = document.getElementById("content");
      const factKeys = Object.keys(catalog);
      content.innerHTML = "";
      if (factKeys.length === 0) {
        const p = document.createElement("p");
        p.id = "empty";
        p.textContent = "No references yet.";
        content.appendChild(p);
        return;
      }
      const table = document.createElement("table");
      table.innerHTML = "<thead><tr><th>Fact key</th><th>Family</th><th>Selector type</th><th>Reference ID</th></tr></thead>";
      const tbody = document.createElement("tbody");
      factKeys.forEach((factKey) => {
        const reference = catalog[factKey];
        const family = reference.subject_document ? reference.subject_document.family : "";
        const selectorType = reference.selector ? reference.selector.type : "";
        const referenceId = reference.reference_id || "";
        const row = document.createElement("tr");
        [factKey, family, selectorType, referenceId].forEach((value) => row.appendChild(cell(value)));
        tbody.appendChild(row);
      });
      table.appendChild(tbody);
      content.appendChild(table);
    }

    fetch("/api/references")
      .then((response) => {
        if (!response.ok) {
          throw new Error(`Server returned ${response.status}`);
        }
        return response.json();
      })
      .then(renderCatalog)
      .catch((error) => renderError(`Failed to load the references catalog: ${error.message}`));
  </script>
</body>
</html>
